
name: Prime Calculator Android Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "prime-calculator-android (1).zip"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract complete project
        run: |
          unzip -q "prime-calculator-android (1).zip" -d /tmp/prime-source
          SOURCE="/tmp/prime-source/prime-calculator-capacitor-prep (1)"
          test -f "$SOURCE/src/main.tsx"
          test -f "$SOURCE/package.json"
          cp -a "$SOURCE/backend" "$SOURCE/public" "$SOURCE/src" .
          cp "$SOURCE/package.json" "$SOURCE/index.html" .
          cp "$SOURCE/capacitor.config.ts" "$SOURCE/postcss.config.js" .
          cp "$SOURCE/tailwind.config.js" "$SOURCE/tsconfig.json" .
          cp "$SOURCE/vite.config.ts" .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Prepare Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: prime-calculator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
